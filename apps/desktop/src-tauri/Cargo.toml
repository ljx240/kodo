[package]
name = "kodo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kodo-core = { path = "../../../crates/core" }
kodo-agent = { path = "../../../crates/agent" }
kodo-shell = { path = "../../../crates/shell" }
kodo-sandbox = { path = "../../../crates/sandbox" }
kodo-memory = { path = "../../../crates/memory" }
kodo-knowledge = { path = "../../../crates/knowledge" }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `tray-icon` is what the macOS menu-bar status item is built from; the icon
# itself is embedded at compile time by `tauri.conf.json`'s `trayIcon`, so no
# runtime image decoder (`image-png`) is needed alongside it.
tauri = { version = "2", features = ["tray-icon"] }
# Both are called from Rust inside our own commands, not from the webview, so
# neither needs a `capabilities/default.json` entry: the ACL gates webview IPC,
# and a Rust-to-Rust call never goes through it. Doing it this way also avoids
# adding `@tauri-apps/plugin-dialog` to package.json.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# `parking_lot` is what `kodo-shell` already uses for the in-process
# resource guard and job-cancel registry; pulling it directly here
# avoids a second std::sync::Mutex layer in the Tauri binding.
parking_lot = "0.12"
portable-pty = "0.9.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Only to assert the exact JSON the GUI receives. The shape of a flattened,
# internally tagged enum is the one thing here that is hard to be sure of by
# reading it.
serde_json = "1"
