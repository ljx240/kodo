# Kodo CI — every job name maps to one stage so a red check pinpoints the failure.
# Offline jobs never need personal API keys. Online model benchmark is opt-in
# via workflow_dispatch only (never on pull_request).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      online_benchmark:
        description: "Run optional online model benchmark (uses repo secret)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # ---------------------------------------------------------------------------
  # Stage: rust-fmt
  # ---------------------------------------------------------------------------
  rust-fmt:
    name: "stage: rust-fmt"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ---------------------------------------------------------------------------
  # Stage: rust-clippy
  # ---------------------------------------------------------------------------
  rust-clippy:
    name: "stage: rust-clippy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Stage: rust-test
  # ---------------------------------------------------------------------------
  rust-test:
    name: "stage: rust-test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test --workspace
        run: cargo test --workspace

  # ---------------------------------------------------------------------------
  # Stage: rust-coverage — report only, no threshold yet
  # ---------------------------------------------------------------------------
  rust-coverage:
    name: "stage: rust-coverage"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage report
        run: |
          cargo llvm-cov --workspace --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage/html
          cargo llvm-cov report --summary-only | tee coverage/summary.txt
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: |
            lcov.info
            coverage/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Stage: agent-benchmark — offline fake provider, fully deterministic
  # ---------------------------------------------------------------------------
  agent-benchmark:
    name: "stage: agent-benchmark"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test agent benchmark (fake provider)
        run: cargo test -p kodo-agent --test agent_benchmark -- --nocapture
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-benchmark-report
          path: target/agent-benchmark/report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Stage: agent-benchmark-online — OPTIONAL, never on pull_request.
  # Requires workflow_dispatch + repo secret ONLINE_BENCH_API_KEY.
  # ---------------------------------------------------------------------------
  agent-benchmark-online:
    name: "stage: agent-benchmark-online"
    if: github.event_name == 'workflow_dispatch' && inputs.online_benchmark
    runs-on: ubuntu-latest
    env:
      KODO_ONLINE_API_KEY: ${{ secrets.ONLINE_BENCH_API_KEY }}
      KODO_ONLINE_ENDPOINT: ${{ vars.ONLINE_BENCH_ENDPOINT || '' }}
      KODO_ONLINE_MODEL: ${{ vars.ONLINE_BENCH_MODEL || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Require secret
        run: |
          if [ -z "$KODO_ONLINE_API_KEY" ]; then
            echo "::error::ONLINE_BENCH_API_KEY secret is not configured"
            exit 1
          fi
      - name: cargo test online benchmark (ignored by default)
        run: cargo test -p kodo-agent --test online_benchmark -- --ignored --nocapture

  # ---------------------------------------------------------------------------
  # Stage: frontend-setup + lint + typecheck + build  (shared install via needs)
  # Split into discrete jobs so the failing stage is obvious in the checks list.
  # ---------------------------------------------------------------------------
  frontend-npm-ci:
    name: "stage: frontend-npm-ci"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Upload node_modules cache key marker
        run: echo "npm-ci-ok=${{ github.sha }}" >> "$GITHUB_OUTPUT"
        id: marker

  frontend-lint:
    name: "stage: frontend-lint"
    runs-on: ubuntu-latest
    needs: frontend-npm-ci
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: eslint
        run: npm run lint
      - name: prettier --check
        run: npm run format:check

  frontend-typecheck:
    name: "stage: frontend-typecheck"
    runs-on: ubuntu-latest
    needs: frontend-npm-ci
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck

  frontend-build:
    name: "stage: frontend-build"
    runs-on: ubuntu-latest
    needs: frontend-npm-ci
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: vite build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Stage: frontend-behaviour — Playwright behaviour suite (no screenshots)
  # Runs on Linux; independent of platform fonts.
  # ---------------------------------------------------------------------------
  frontend-behaviour:
    name: "stage: frontend-behaviour"
    runs-on: ubuntu-latest
    needs: frontend-npm-ci
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright behaviour tests
        run: npx playwright test --project=behaviour
      - name: Upload behaviour report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-behaviour-report
          path: apps/desktop/playwright-report/
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Stage: frontend-visual — screenshot baselines are *-darwin.png only.
  # Strategy: run visual comparison exclusively on macos runners so system fonts
  # match the baselines. CI never runs --update-snapshots (snapshots are only
  # regenerated deliberately on a developer machine).
  # ---------------------------------------------------------------------------
  frontend-visual:
    name: "stage: frontend-visual"
    runs-on: macos-14
    needs: frontend-npm-ci
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Playwright visual tests (darwin baselines, no snapshot update)
        run: npx playwright test --project=visual
        env:
          # Guard: never allow accidental snapshot mutation in CI.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "0"
      - name: Upload visual diff artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-diffs
          path: |
            apps/desktop/test-results/
            apps/desktop/playwright-report/
          if-no-files-found: warn
