[package]
name = "kodo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kodo"
path = "src/main.rs"

[dependencies]
kodo-core = { path = "../core" }
kodo-agent = { path = "../agent" }
kodo-shell = { path = "../shell" }
kodo-sandbox = { path = "../sandbox" }
kodo-memory = { path = "../memory", features = ["download"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
